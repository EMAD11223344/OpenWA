[supervisord]
nodaemon=true
user=root

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err

[program:evolution]
command=npm run start:prod
directory=/evolution
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/evolution.log
stderr_logfile=/var/log/supervisor/evolution.err